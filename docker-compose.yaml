name: crew-app

services:
  crew-db:
    image: postgres:18-alpine
    restart: always
    environment:
       POSTGRES_USER: root
       POSTGRES_PASSWORD: mysecretpassword123
       POSTGRES_DB: crewdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d crewdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_volume:/var/lib/postgresql
    ports:
      - "6432:5432"

  api:
    container_name: api
    depends_on:
      crew-db: 
       condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - ./apps/api/.env.docker
    build:
     context: .
     dockerfile: ./apps/api/Dockerfile
        


volumes:
  db_volume: